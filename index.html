<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rian's Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      text-align: center;
    }
    h1 { font-size: 3.5rem; margin: 0 0 0.5rem; text-shadow: 3px 3px 0 rgba(0,0,0,0.15); }
    p { font-size: 1.5rem; margin: 0; }
    .rocket { font-size: 5rem; display: inline-block; animation: bob 2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  </style>
</head>
<body>
  <main>
    <div class="rocket">🚀</div>
    <h1>Rian's Website</h1>
    <p>Coming soon!</p>
  </main>
</body>
</html>
